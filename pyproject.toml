[project]
name = "hermes-trading"
version = "0.1.0"
description = "Self-improving paper trading worker"
requires-python = ">=3.11"
dependencies = [
    "ccxt",
    "yfinance",
    "pyyaml",
    "httpx",
    "aiofiles",
    "numpy",
    "pandas",
    "rich",
    "alpaca-py",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
